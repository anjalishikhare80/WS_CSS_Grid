
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive CSS Grid Layout</title>

    <style>

       

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 25px;
        }

        

        .container {
            max-width: 1100px;
            margin: auto;

            display: grid;

            grid-template-columns: 1fr 3fr;
            grid-template-rows: 60px 220px 140px 60px;

            gap: 8px;
        }

        

        .box {
            display: flex;
            justify-content: center;
            align-items: center;

            border: 3px solid white;
            border-radius: 4px;

            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        

        .navbar {
            grid-column: 1 / 3;
            background-color: #a7f3df;
        }

        

        .sidebar {
            grid-column: 1;
            grid-row: 2 / 5;
            background-color: #00e9ec;
        }

       

        .main {
            grid-column: 2;
            grid-row: 2;
            background-color: #80f5f1;
        }

      

        .content {
            grid-column: 2;
            grid-row: 3;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

       

        .content-box {
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #64f0c4;

            border: 3px solid white;
            border-radius: 4px;

            font-size: 13px;
            font-weight: bold;
            color: #333;
        }

        

        .footer {
            grid-column: 2;
            grid-row: 4;
            background-color: #15d9b5;
        }

        

        @media (max-width: 650px) {

            body {
                padding: 12px;
            }

            .container {
                grid-template-columns: 1fr;

                grid-template-rows:
                    60px
                    50px
                    250px
                    100px
                    100px
                    100px
                    60px;

                gap: 8px;
            }

            

            .navbar {
                grid-column: 1;
                grid-row: 1;
            }

           

            .sidebar {
                grid-column: 1;
                grid-row: 2;
            }


            .main {
                grid-column: 1;
                grid-row: 3;
            }

         

            .content {
                grid-column: 1;
                grid-row: 4 / 7;

                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, 100px);
            }

            

            .footer {
                grid-column: 1;
                grid-row: 7;
            }
        }

    </style>

</head>

<body>

    <main class="container">

        
        <header class="box navbar">
            NAVBAR
        </header>

        
        <aside class="box sidebar">
            SIDEBAR
        </aside>

        
        <section class="box main">
            MAIN
        </section>

        
        <section class="content">

            <div class="content-box">
                CONTENT 1
            </div>

            <div class="content-box">
                CONTENT 2
            </div>

            <div class="content-box">
                CONTENT 3
            </div>

        </section>

       
        <footer class="box footer">
            FOOTER
        </footer>

    </main>

</body>

</html>
