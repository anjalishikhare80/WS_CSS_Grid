
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .gallery {
            width: 560px;
            max-width: 95%;
            padding: 50px 30px 30px;
            background-color: #f1f1f1;
            position: relative;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .photo {
            width: 100%;
            aspect-ratio: 1 / 1;
            padding: 5px;
            background-color: white;
            border: 1px solid #ddd;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .main-photo {
            position: absolute;
            width: 230px;
            height: 230px;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px;
            background-color: white;
            border: 1px solid #ddd;
            z-index: 2;
        }

        .main-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 500px) {
            .gallery {
                padding: 40px 15px 20px;
            }

            .grid-container {
                gap: 10px;
            }

            .main-photo {
                width: 42%;
                height: auto;
                aspect-ratio: 1 / 1;
            }
        }
    </style>
</head>

<body>

    <div class="gallery">

        <div class="grid-container">

            <div class="photo">
                <img src="images/image1.jpg" alt="Portrait 1">
            </div>

            <div class="photo">
                <img src="images/image2.jpg" alt="Portrait 2">
            </div>

            <div class="photo">
                <img src="images/image3.jpg" alt="Portrait 3">
            </div>

            <div class="photo">
                <img src="images/image4.jpg" alt="Portrait 4">
            </div>

            <div class="photo">
                <img src="images/image5.jpg" alt="Portrait 5">
            </div>

            <div class="photo">
                <img src="images/image6.jpg" alt="Portrait 6">
            </div>

            <div class="photo">
                <img src="images/image7.jpg" alt="Portrait 7">
            </div>

            <div class="photo">
                <img src="images/image8.jpg" alt="Portrait 8">
            </div>

            <div class="photo">
                <img src="images/image9.jpg" alt="Portrait 9">
            </div>

        </div>

        <div class="main-photo">
            <img src="images/main.jpg" alt="Main Portrait">
        </div>

    </div>

</body>
</html>
